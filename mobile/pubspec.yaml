name: dota_builds
description: MangoDota — мета Dota 2 і AI-білди від Gemini.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  intl: any
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Копії backend/database/seeds (Flutter не бачить файлів поза mobile/).
    - assets/mocks/
    # Довідники «назва → іконка» з OpenDota: tool/generate_dota_assets.dart.
    - assets/data/
  # Змінні шрифти з github.com/google/fonts (OFL, ліцензії поруч у assets/fonts).
  # Вбудовані, щоб застосунок виглядав однаково й без інтернету.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
