openapi: 3.0.3
info:
  title: MangoDota API
  description: Dart Shelf REST API (SQLite + OpenDota + Google Gemini API) для мобільного клієнта MangoDota (Flutter).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Dart (shelf) server

paths:
  /api/health:
    get:
      summary: Health check сервера
      responses:
        '200':
          description: Сервер працює
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    example: "2026-10-08T11:00:00Z"

  /api/auth/register:
    post:
      summary: Реєстрація нового користувача
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "player@example.com"
                password:
                  type: string
                  example: "secret123"
      responses:
        '201':
          description: Користувача створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Невалідні дані або email зайнятий

  /api/auth/login:
    post:
      summary: Авторизація користувача
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: "player@example.com"
                password:
                  type: string
                  example: "secret123"
      responses:
        '200':
          description: Успішний вхід, повертає JWT токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Невірний логін або пароль

  /api/meta/dota:
    get:
      summary: Отримати список героїв актуальної мети (OpenDota + Gemini AI tier)
      responses:
        '200':
          description: Актуальний мета-звіт
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_at:
                    type: string
                    example: "2026-10-08T11:00:00Z"
                  patch:
                    type: string
                    example: "7.37d"
                  meta_heroes:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetaHero'

  /api/dota/heroes/{id}:
    get:
      summary: Детальна картка героя з AI-білдом від Google Gemini API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 14
      responses:
        '200':
          description: Дані героя з білдом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroWithBuild'
        '404':
          description: Героя не знайдено

  /admin/sync:
    post:
      summary: Ручний запуск синхронізації з OpenDota та оновлення білдів через Gemini (для демо)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Синхронізація успішно виконана
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  synced_at:
                    type: string
                    example: "2026-10-08T11:05:00Z"
                  heroes_updated:
                    type: integer
                    example: 127

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsIn..."
        user:
          type: object
          properties:
            id:
              type: string
              example: "usr_123"
            email:
              type: string
              example: "player@example.com"

    MetaHero:
      type: object
      properties:
        id:
          type: integer
          example: 14
        name:
          type: string
          example: "Pudge"
        win_rate:
          type: number
          example: 53.4
        pick_rate:
          type: number
          example: 26.8
        primary_attr:
          type: string
          example: "str"
        attack_type:
          type: string
          example: "Melee"
        roles:
          type: array
          items:
            type: string
          example: ["Disabler", "Initiator", "Durable", "Nuker"]
        avatar_url:
          type: string
          example: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/pudge.png"
        tier:
          type: string
          example: "S"
        ai_summary:
          type: string
          example: "Найпопулярніший герой. Сильний ранній тиск через Meat Hook."

    HeroWithBuild:
      allOf:
        - $ref: '#/components/schemas/MetaHero'
        - type: object
          properties:
            bio:
              type: string
              example: "На Полях Вічної Різанини глибоко на південь від Квойджа..."
            stats:
              type: object
              properties:
                base_hp:
                  type: integer
                  example: 700
                base_mana:
                  type: integer
                  example: 267
                base_armor:
                  type: number
                  example: 1.5
                movement_speed:
                  type: integer
                  example: 280
                damage:
                  type: string
                  example: "70-76"
            abilities:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    example: "meat_hook"
                  name:
                    type: string
                    example: "Meat Hook"
                  description:
                    type: string
                    example: "Запускає кривавий гак..."
                  cooldown:
                    type: string
                    example: "18/16/14/12"
                  mana_cost:
                    type: string
                    example: "110/120/130/140"
                  icon_url:
                    type: string
                    example: "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/abilities/pudge_meat_hook.png"
                  slot_order:
                    type: integer
                    example: 1
            ai_build:
              type: object
              properties:
                skill_order:
                  type: array
                  items:
                    type: string
                  example: ["Meat Hook", "Rot", "Meat Hook", "Flesh Heap", "Meat Hook", "Dismember"]
                core_items:
                  type: array
                  items:
                    type: string
                  example: ["Phase Boots", "Aghanim's Scepter", "Blink Dagger", "Black King Bar"]
                tactics:
                  type: string
                  example: "Тримайте позицію в тумані війни для хука..."
