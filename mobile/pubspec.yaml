name: dota_builds
description: MangoDota — мета Dota 2 і AI-білди від Claude.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Копії backend/database/seeds (Flutter не бачить файлів поза mobile/).
    - assets/mocks/
